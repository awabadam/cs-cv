# Serves the static build (dist/). Pages revalidate on every visit (cheap, by ETag) so a
# deploy shows at once; hashed assets in /_astro never change and are cached for a year.
server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;

    absolute_redirect off;
    server_tokens off;
    charset utf-8;

    # The build writes a .gz beside every text file; anything else is compressed on the fly.
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript image/svg+xml application/json text/plain application/xml;

    error_page 404 /404.html;

    # The case studies now sit under the work they describe.
    location ~ ^/case-studies/(.+)$ {
        return 301 /work/$1;
    }

    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Motion clips
    location /work/ {
        location ~ \.mp4$ {
            add_header Cache-Control "public, max-age=2592000";
            try_files $uri =404;
        }
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/ =404;
    }
}
